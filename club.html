<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a club on SideOut</title>
<style>
  :root { --plum:#171021; --card:#251C31; --coral:#FF6B5B; --gold:#FFB454;
          --text:#FBF4EA; --muted:#A797B8; --field:#1e1729; }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--plum); color:var(--text); margin:0; padding:28px 20px;
         max-width:460px; margin:0 auto; line-height:1.5; }
  .brand { color:var(--coral); font-weight:800; letter-spacing:4px; font-size:14px; }
  h1 { font-size:26px; margin:6px 0 2px; letter-spacing:1px; }
  .sub { color:var(--muted); font-size:14px; margin-top:0; }
  .card { background:var(--card); border-radius:18px; padding:20px; margin-top:20px; }
  label { display:block; font-size:11px; letter-spacing:1px; font-weight:800;
          color:var(--muted); margin:14px 0 6px; }
  input, select { width:100%; padding:13px; border:none; border-radius:12px;
                  background:var(--field); color:var(--text); font-size:16px; }
  button { width:100%; padding:15px; border:none; border-radius:14px; margin-top:20px;
           background:var(--coral); color:#fff; font-size:16px; font-weight:800; }
  button:disabled { opacity:.5; }
  .msg { text-align:center; padding:30px 10px; }
  .msg .big { font-size:40px; }
  .code { color:var(--gold); font-weight:800; letter-spacing:2px; }
  .hint { color:var(--muted); font-size:12px; margin-top:16px; text-align:center; }
  .hidden { display:none; }
  .getapp { background:var(--card); border-radius:18px; padding:18px; margin-top:16px; text-align:center; }
  .getapp h3 { margin:0 0 4px; font-size:16px; }
  .getapp p { margin:0 0 14px; font-size:13px; }
  .appbtn { display:inline-block; background:#fff; color:#000; text-decoration:none;
            font-weight:800; padding:12px 22px; border-radius:12px; font-size:15px; }
</style>
</head>
<body>
  <div class="brand">SIDEOUT</div>
  <h1>You've been invited to a club</h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <div class="card" id="main">
      <p class="hint">
        Joining a club needs the app - it's where your squad, your training and
        your fixtures live. Open SideOut and this code will take you straight in.
      </p>
      <a class="appbtn" id="appstore" href="https://apps.apple.com/app/id6788060994">Get SideOut - free</a>
      <p class="hint" id="already" style="margin-top:14px">
        Already have it? <a href="#" id="openapp" style="color:var(--gold)">Open the app</a>
      </p>
  </div>

<script>
  // Code from ?code=XXXX
  var params = new URLSearchParams(location.search);
  var code = (params.get('code') || '').toUpperCase();
  document.getElementById('sub').innerHTML = code
    ? 'Club code <span class="code">' + code + '</span>'
    : 'No club code in this link - ask whoever sent it to share the QR again.';

  var deep = 'sideout://club.html?code=' + encodeURIComponent(code);
  document.getElementById('openapp').setAttribute('href', deep);

  // OPEN THE APP IF THEY HAVE IT.
  //
  // Same reasoning as the session page: somebody with SideOut installed should
  // end up in the app, joining as themselves, not filling in a web form as a
  // stranger. If the app isn't there nothing happens and this page stands.
  //
  // ?web=1 skips it, so "open in browser" always works and nobody gets stuck.
  (function () {
    if (params.get('web') === '1' || !code) return;
    if (sessionStorage.getItem('sideout-club-' + code)) return;
    sessionStorage.setItem('sideout-club-' + code, '1');
    location.href = deep;
  })();
</script>
</body>
</html>
